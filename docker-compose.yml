version: '3.8'

services:
  # FastAPI Python service
  fastapi:
    build:
      context: ./FastAPI
      dockerfile: Dockerfile
    container_name: neurograde-fastapi
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGO_URI=${MONGO_URI}
    volumes:
      - ./FastAPI:/app
    restart: unless-stopped
    networks:
      - neurograde-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Express server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: neurograde-server
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - MONGODB_URI=${MONGO_URI}
      - SESSION_SECRET=${SESSION_SECRET:-default-secret-key}
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - neurograde-network
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: neurograde-client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - neurograde-network
    depends_on:
      - server
      - fastapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: neurograde-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - neurograde-network
    depends_on:
      - client
      - server
      - fastapi

networks:
  neurograde-network:
    driver: bridge

volumes:
  node_modules_server:
  node_modules_client:

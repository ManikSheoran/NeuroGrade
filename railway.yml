# Railway Deployment Configuration
# This file tells Railway how to deploy your services

services:
  client:
    build:
      dockerfile: client/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${{server.url}}
      - NEXT_PUBLIC_FASTAPI_URL=${{fastapi.url}}
    ports:
      - 3000
    domains:
      - neurograde-client.railway.app

  server:
    build:
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${{MONGODB_URI}}
    ports:
      - 8000
    domains:
      - neurograde-server.railway.app

  fastapi:
    build:
      dockerfile: FastAPI/Dockerfile
    environment:
      - MONGO_URI=${{MONGODB_URI}}
      - GEMINI_API_KEY=${{GEMINI_API_KEY}}
    ports:
      - 8000
    domains:
      - neurograde-fastapi.railway.app
